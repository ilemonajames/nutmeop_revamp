name: nutme_up_mobile
description: NUTME UP - AI and EV-ready mobility maintenance platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Models / JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4

  # Location & permissions (EV + nearby discovery)
  permission_handler: ^11.4.0
  geolocator: ^13.0.4
  google_maps_flutter: ^2.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

  # Optional for MVP payments (redirect/webview)
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  build_runner: ^2.5.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
